<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
// Apply the saved theme before the first paint, so that the page never flashes in the other theme.
// No saved choice (or a bad value, or blocked storage) means: the theme of the system or browser setting.
try {
  var savedTheme = localStorage.getItem("hub.theme");
  if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
} catch (e) { /* storage is blocked */ }
</script>
<title>Project Board</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-eyebrow"><span class="dot"></span><span id="brandEyebrow">Workflow Hub</span></div>
      <div class="brand-row">
        <div class="brand-title">Project Board</div>
        <button class="theme-toggle" id="themeToggle" type="button" data-mode="light" aria-live="polite" aria-label="Theme: Light. Click for Dark." title="Theme: Light. Click for Dark.">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><mask id="themeMoonMask"><rect width="24" height="24" fill="#fff"/><circle cx="17" cy="8" r="6.5" fill="#000"/></mask><circle cx="12" cy="12" r="8.5" fill="currentColor" mask="url(#themeMoonMask)"/></svg>
        </button>
      </div>
      <div class="brand-meta mono" id="snapshotLine">snapshot —</div>
    </div>
    <div class="switcher" id="switcher" hidden></div>
    <div class="sidebar-search">
      <input type="text" id="searchBox" placeholder="Filter tasks &amp; notes…" autocomplete="off">
    </div>
    <nav class="nav-scroll" id="navScroll"></nav>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button">☰ Menu</button>
      <div class="crumb" id="crumb"><b>Overview</b></div>
      <div class="topbar-spacer"></div>
      <button class="refresh-btn" id="refreshBtn" type="button" title="Reload manifests">↻ Refresh</button>
      <div class="snapshot-pill" id="snapshotPill">snapshot —</div>
    </div>
    <div class="content-scroll" id="contentScroll">
      <div class="state-msg">Loading board…</div>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="vendor/marked.min.js"></script>
<script src="./app.js"></script>

</body>
</html>
