<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Board</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-eyebrow"><span class="dot"></span><span id="brandEyebrow">Workflow Hub</span></div>
      <div class="brand-title">Project Board</div>
      <div class="brand-meta mono" id="snapshotLine">snapshot —</div>
    </div>
    <div class="switcher" id="switcher" hidden></div>
    <div class="sidebar-search">
      <input type="text" id="searchBox" placeholder="Filter tasks &amp; notes…" autocomplete="off">
    </div>
    <nav class="nav-scroll" id="navScroll"></nav>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button">☰ Menu</button>
      <div class="crumb" id="crumb"><b>Overview</b></div>
      <div class="topbar-spacer"></div>
      <button class="refresh-btn" id="refreshBtn" type="button" title="Reload manifests">↻ Refresh</button>
      <div class="snapshot-pill" id="snapshotPill">snapshot —</div>
    </div>
    <div class="content-scroll" id="contentScroll">
      <div class="state-msg">Loading board…</div>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="vendor/marked.min.js"></script>
<script src="./app.js"></script>

</body>
</html>
